name: Publish extension to Marketplace

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "clone-work-items/vss-extension.json"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clone-work-items
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so all tags are available

      - name: Validate version against latest release tag
        id: version
        run: |
          VERSION=$(node -p "require('./vss-extension.json').version")
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' in vss-extension.json is not valid semver (X.Y.Z)."
            exit 1
          fi

          LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -1)
          LATEST=${LATEST_TAG#v}
          echo "Manifest version: $VERSION — latest released tag: ${LATEST_TAG:-<none>}"

          if [ -n "$LATEST" ]; then
            if [ "$VERSION" = "$LATEST" ]; then
              echo "::error::Version $VERSION is already released (tag $LATEST_TAG exists). Bump the version in vss-extension.json."
              exit 1
            fi
            HIGHEST=$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)
            if [ "$HIGHEST" != "$VERSION" ]; then
              echo "::error::Version $VERSION is LOWER than the latest released version $LATEST. Versions must only increase."
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Package extension
        run: npx tfx extension create --manifest-globs vss-extension.json

      - name: Upload .vsix as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ steps.version.outputs.version }}
          path: clone-work-items/*.vsix

      - name: Publish to Marketplace
        run: >
          npx tfx extension publish
          --manifest-globs vss-extension.json
          --token "$AZDO_MARKETPLACE_PAT"
          --no-prompt
        env:
          AZDO_MARKETPLACE_PAT: ${{ secrets.AZDO_MARKETPLACE_PAT }}

      # Tag only AFTER a successful publish, so a failed run can simply be retried.
      - name: Create release tag
        run: |
          VERSION=${{ steps.version.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
